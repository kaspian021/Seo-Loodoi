name: quality

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seo_loodoi
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: seo_loodoi
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U seo_loodoi -d seo_loodoi"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/SeoLoodoi.Web/package-lock.json
      - name: Restore backend
        run: dotnet restore SeoLoodoi.slnx
      - name: Build backend with warnings as errors
        run: dotnet build SeoLoodoi.slnx --no-restore --configuration Release -warnaserror
      - name: Run backend tests
        run: |
          # Console output is mirrored to /tmp/dotnet-test.log so the failure
          # annotations step can surface it (run logs are not always retrievable).
          dotnet test SeoLoodoi.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" > /tmp/dotnet-test.log 2>&1
          rc=$?
          cat /tmp/dotnet-test.log
          exit $rc
        env:
          # Real-Postgres integration tests connect to the postgres:16 service.
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=seo_loodoi;Username=seo_loodoi;Password=ci-password
      - name: Annotate failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, re
          seen = {}
          for trx in sorted(set(glob.glob("test-results.trx") + glob.glob("**/test-results.trx", recursive=True))):
              data = open(trx, encoding="utf-8", errors="replace").read()
              for m in re.finditer(
                  r'<UnitTestResult[^>]*?testName="([^"]+)"[^>]*?outcome="Failed"[^>]*>.*?(?:<Message>\s*(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?\s*</Message>)?',
                  data, re.S):
                  name = m.group(1)[:120]
                  msg = re.sub(r"\s+", " ", (m.group(2) or "")).strip()
                  if name not in seen or (not seen[name] and msg):
                      seen[name] = msg
          if seen:
              for name, msg in seen.items():
                  print(f"::error file=tests/SeoLoodoi.Domain.Tests::FAILED {name} :: {msg[:400] if msg else '(no message captured)'}")
          # Fall back to the original console log tail when the trx has no
          # usable details (fixture/infra failures, truncated trx, ...).
          if not any(seen.values()):
              try:
                  lines = [l.rstrip() for l in open("/tmp/dotnet-test.log", encoding="utf-8", errors="replace") if l.strip()]
                  interesting = [l for l in lines if any(k in l for k in ("error", "Error", "Failed", "Exception", "Npgsql", "Postgres", "Assert", "SKIP"))]
                  for l in (interesting[-40:] or lines[-40:]):
                      print(f"::error file=tests/SeoLoodoi.Domain.Tests::test-log :: {l[:300]}")
              except OSError:
                  print("::error file=tests/SeoLoodoi.Domain.Tests::dotnet test failed; no trx details and no console log available")
          PY
      - name: Install EF tooling
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.4
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Validate migration script generation
        env:
          DatabaseProvider: Postgres
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=seo_loodoi;Username=seo_loodoi;Password=ci-password
        run: dotnet ef migrations script --idempotent --project src/SeoLoodoi.Infrastructure --startup-project src/SeoLoodoi.Api --output /tmp/seo-loodoi.sql
      - name: Install frontend dependencies
        working-directory: src/SeoLoodoi.Web
        run: npm ci
      - name: Frontend lint
        working-directory: src/SeoLoodoi.Web
        run: npm run lint
      - name: Frontend production build
        working-directory: src/SeoLoodoi.Web
        run: npm run build
      - name: Frontend dependency audit
        working-directory: src/SeoLoodoi.Web
        run: npm audit --audit-level=high --omit=dev
