name: quality

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seo_loodoi
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: seo_loodoi
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U seo_loodoi -d seo_loodoi"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/SeoLoodoi.Web/package-lock.json
      - name: Restore backend
        run: dotnet restore SeoLoodoi.slnx
      - name: Build backend with warnings as errors
        id: build
        # pipefail keeps the step failing when dotnet fails, while tee preserves
        # the compiler output for the annotation step below. GitHub does not let
        # us read job logs through the API for this repo, so compiler errors have
        # to be surfaced as check-run annotations to be visible at all.
        run: |
          set -o pipefail
          dotnet build SeoLoodoi.slnx --no-restore --configuration Release -warnaserror 2>&1 | tee build.log
      - name: Surface build errors as annotations
        if: failure() && steps.build.outcome == 'failure'
        run: |
          python3 - <<'EOF'
          import re
          try:
              lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          except FileNotFoundError:
              print('::error::build failed but build.log was not produced')
              raise SystemExit(0)
          errors = [l for l in lines if re.search(r': (error|warning) ', l)]
          for line in errors[:60]:
              safe = line.replace('%', '%25').replace('\r', ' ').replace('\n', ' ')
              print(f"::error::{safe}")
          if not errors:
              print('::error::build failed with no error lines captured (see build.log)')
          EOF
      - name: Run backend tests
        run: dotnet test SeoLoodoi.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
      - name: Publish backend test summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import glob, json, os, xml.etree.ElementTree as ET

          NS = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          per_class = {}
          failures = []

          for trx in glob.glob('**/test-results.trx', recursive=True):
              try:
                  root = ET.parse(trx).getroot()
              except Exception:
                  continue
              for unit in root.iter(f'{NS}UnitTestResult'):
                  name = unit.get('testName') or '?'
                  # Theory cases append their InlineData to the test name, e.g.
                  # `...UrlNormalizerTests.Normalize(url: "a.b", expected: "c")`.
                  # Strip the argument list before splitting, otherwise the class
                  # name is parsed out of a data value and the row is meaningless.
                  bare = name.split('(')[0]
                  parts = bare.split('.')
                  cls = parts[-2] if len(parts) >= 2 else bare
                  row = per_class.setdefault(cls, {'passed': 0, 'failed': 0, 'other': 0})
                  outcome = unit.get('outcome') or 'Unknown'
                  if outcome == 'Passed':
                      row['passed'] += 1
                  elif outcome == 'Failed':
                      row['failed'] += 1
                      failures.append(name)
                  else:
                      row['other'] += 1

          total = sum(r['passed'] + r['failed'] + r['other'] for r in per_class.values())
          passed = sum(r['passed'] for r in per_class.values())
          failed = sum(r['failed'] for r in per_class.values())

          # The per-class table is the point of this step: it is the only place
          # that proves which test classes were actually discovered and executed,
          # since the job log is not retrievable from outside the runner.
          lines = ['| Test class | Passed | Failed |', '| --- | ---: | ---: |']
          for cls in sorted(per_class):
              r = per_class[cls]
              lines.append(f"| `{cls}` | {r['passed']} | {r['failed']} |")
          if failures:
              lines.append('')
              lines.append('**Failures**')
              lines.extend(f'- `{f}`' for f in failures[:25])

          if total:
              title = f'{passed} passed · {failed} failed · {total} total'
              summary = '\n'.join(lines)
              conclusion = 'success' if failed == 0 else 'failure'
          else:
              title = 'no test results'
              summary = 'No test results were produced - the build most likely failed before the test step ran.'
              conclusion = 'failure'

          payload = {
              'name': 'backend-test-summary',
              'head_sha': os.environ['GITHUB_SHA'],
              'status': 'completed',
              'conclusion': conclusion,
              'output': {'title': title, 'summary': summary},
          }
          with open('check-run.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh)
          PY

          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input check-run.json > /dev/null
      - name: Surface test failures as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          NS = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          found = False
          for trx in glob.glob('**/test-results.trx', recursive=True):
              try:
                  root = ET.parse(trx).getroot()
              except Exception as ex:
                  print(f"::error::trx parse failed: {ex}")
                  continue
              for unit in root.iter(f'{NS}UnitTestResult'):
                  if unit.get('outcome') == 'Failed':
                      found = True
                      message = ''
                      output = unit.find(f'{NS}Output')
                      if output is not None:
                          info = output.find(f'{NS}ErrorInfo')
                          if info is not None and info.find(f'{NS}Message') is not None:
                              message = (info.find(f'{NS}Message').text or '')[:800]
                      print(f"::error::{unit.get('testName')}: {message}")
          if not found:
              print('::error::backend tests failed but no failed tests were found in trx (check build output)')
          EOF
      - name: Install EF tooling
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.4
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Verify migrations match the model
        env:
          DatabaseProvider: Postgres
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=seo_loodoi;Username=seo_loodoi;Password=ci-password
        run: dotnet ef migrations has-pending-model-changes --project src/SeoLoodoi.Infrastructure --startup-project src/SeoLoodoi.Api
      - name: Validate migration script generation
        env:
          DatabaseProvider: Postgres
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=seo_loodoi;Username=seo_loodoi;Password=ci-password
        run: dotnet ef migrations script --idempotent --project src/SeoLoodoi.Infrastructure --startup-project src/SeoLoodoi.Api --output /tmp/seo-loodoi.sql
      - name: Install frontend dependencies
        working-directory: src/SeoLoodoi.Web
        run: npm ci
      - name: Frontend lint
        working-directory: src/SeoLoodoi.Web
        run: npm run lint
      - name: Frontend unit tests
        working-directory: src/SeoLoodoi.Web
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results.xml
      - name: Surface frontend test failures as annotations
        if: failure()
        working-directory: src/SeoLoodoi.Web
        run: |
          python3 - <<'PYEOF'
          import glob
          import xml.etree.ElementTree as ET
          found = False
          for path in glob.glob('test-results.xml'):
              root = ET.parse(path).getroot()
              for case in root.iter('testcase'):
                  for fail in list(case.iter('failure')) + list(case.iter('error')):
                      found = True
                      message = (fail.get('message') or fail.text or '').replace('\n', ' ')[:400]
                      print(f"::error::{case.get('classname')}.{case.get('name')}: {message}")
          if not found:
              import os
              if os.path.exists('test-results.xml'):
                  print('::error::frontend tests failed but no failed case was found in junit xml (check vitest output)')
              else:
                  print('::notice::frontend test step did not produce junit output (it was likely skipped after an earlier failure)')
          PYEOF
      - name: Frontend production build
        working-directory: src/SeoLoodoi.Web
        run: npm run build
      - name: Frontend dependency audit
        working-directory: src/SeoLoodoi.Web
        run: npm audit --audit-level=high --omit=dev
