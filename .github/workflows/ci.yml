name: quality

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seo_loodoi
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: seo_loodoi
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U seo_loodoi -d seo_loodoi"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/SeoLoodoi.Web/package-lock.json
      - name: Restore backend
        run: dotnet restore SeoLoodoi.slnx
      - name: Build backend with warnings as errors
        run: dotnet build SeoLoodoi.slnx --no-restore --configuration Release -warnaserror
      - name: Run backend tests
        run: dotnet test SeoLoodoi.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
        env:
          # Real-Postgres integration tests connect to the postgres:16 service.
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=seo_loodoi;Username=seo_loodoi;Password=ci-password
      - name: Annotate failing tests
        if: failure()
        run: |
          python3 - > /tmp/trx-report.txt <<'PY'
          import glob, re
          seen = {}
          for trx in sorted(set(glob.glob("test-results.trx") + glob.glob("**/test-results.trx", recursive=True))):
              data = open(trx, encoding="utf-8", errors="replace").read()
              for m in re.finditer(
                  r'<UnitTestResult[^>]*?testName="([^"]+)"[^>]*?outcome="Failed"[^>]*>.*?(?:<Message>\s*(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?\s*</Message>)?',
                  data, re.S):
                  name, msg = m.group(1), re.sub(r"\s+", " ", (m.group(2) or "")).strip()
                  key = name[:120]
                  if key not in seen:
                      seen[key] = msg
          if not seen:
              print("::error file=tests/SeoLoodoi.Domain.Tests::dotnet test failed; no trx failure details parsed (see step log)")
              print("NEED_RERUN")
          else:
              for name, msg in seen.items():
                  if msg:
                      print(f"::error file=tests/SeoLoodoi.Domain.Tests::FAILED {name} :: {msg[:400]}")
                  else:
                      print(f"::error file=tests/SeoLoodoi.Domain.Tests::FAILED {name} :: (no message captured)")
              if all(not m for m in seen.values()):
                  print("NEED_RERUN")
          PY
          if grep -q NEED_RERUN /tmp/trx-report.txt; then
            # No usable per-test details (fixture/infra failure, empty messages):
            # re-run with the console logger and surface the tail as annotations.
            dotnet test SeoLoodoi.slnx --no-build --configuration Release --logger "console;verbosity=normal" > /tmp/test-rerun.log 2>&1 || true
            python3 - /tmp/test-rerun.log <<'PY'
          import sys
          lines = [l.rstrip() for l in open(sys.argv[1], encoding="utf-8", errors="replace") if l.strip()]
          interesting = [l for l in lines if any(k in l for k in ("error", "Error", "Failed", "Exception", "SKIP", "Assert", "Npgsql", "Postgres"))]
          tail = interesting[-40:] or lines[-40:]
          for l in tail:
              print(f"::error file=tests/SeoLoodoi.Domain.Tests::test-log :: {l[:300]}")
          PY
          else
            cat /tmp/trx-report.txt
          fi
      - name: Install EF tooling
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.4
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Validate migration script generation
        env:
          DatabaseProvider: Postgres
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=seo_loodoi;Username=seo_loodoi;Password=ci-password
        run: dotnet ef migrations script --idempotent --project src/SeoLoodoi.Infrastructure --startup-project src/SeoLoodoi.Api --output /tmp/seo-loodoi.sql
      - name: Install frontend dependencies
        working-directory: src/SeoLoodoi.Web
        run: npm ci
      - name: Frontend lint
        working-directory: src/SeoLoodoi.Web
        run: npm run lint
      - name: Frontend production build
        working-directory: src/SeoLoodoi.Web
        run: npm run build
      - name: Frontend dependency audit
        working-directory: src/SeoLoodoi.Web
        run: npm audit --audit-level=high --omit=dev
