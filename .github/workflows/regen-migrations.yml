name: regenerate-ef-snapshot

# Maintenance workflow: regenerates the EF Core model snapshot / adds a realigning
# migration when the runtime model drifts from the checked-in snapshot
# (surfaced by EF10 PendingModelChangesWarning in MigrateAsync).
on:
  push:
    branches: [arena/**]
    paths:
      - '.github/workflows/regen-migrations.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a09bd2-seo-loodoi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore backend
        run: dotnet restore SeoLoodoi.slnx
      - name: Install EF tooling
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.4
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Add realigning migration if the model drifted
        env:
          DatabaseProvider: Postgres
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=seo_loodoi;Username=seo_loodoi;Password=design-time-only
        run: |
          if dotnet ef migrations add RealignModelSnapshot --project src/SeoLoodoi.Infrastructure --startup-project src/SeoLoodoi.Api; then
            echo "MIGRATION_CREATED=true" >> "$GITHUB_ENV"
          else
            echo "No model changes detected by design-time tooling."
          fi
      - name: Commit regenerated snapshot
        if: env.MIGRATION_CREATED == 'true'
        run: |
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add src/SeoLoodoi.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Regenerate EF snapshot via RealignModelSnapshot migration"
            git push origin arena/01a09bd2-seo-loodoi
          fi
      - name: Report residual diff
        if: always()
        run: git status --porcelain
